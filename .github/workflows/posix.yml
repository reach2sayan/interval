#
# Self-contained CI.  It runs the same jobs on the same platforms as the
# Boost.CI reusable workflow this repository used before, with the settings
# it passed to it:
#   - MinGW disabled (https://github.com/boostorg/interval/issues/41)
#   - clang before 11 excluded: clang < 10 does not support the necessary
#     floating point options (-frounding-math) and clang 10 has a C++20
#     ambiguous operator resolution bug
#     (https://github.com/llvm/llvm-project/issues/43110)
---
name: POSIX

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - pr/**
    paths-ignore:
      - LICENSE
      - meta/**
      - README.md

concurrency:
  group: ${{ github.ref }}:${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SELF: numeric/interval
  GIT_FETCH_JOBS: 8
  NET_RETRY_COUNT: 5
  B2_LINK: shared,static
  B2_VARIANT: debug,release

jobs:
  posix:
    name: posix (${{ matrix.name || matrix.compiler }}, ${{ matrix.cxxstd }}, ${{ matrix.container || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # libstdc++
          - { compiler: gcc-4.7,   cxxstd: "11",                os: ubuntu-latest, container: "ubuntu:16.04" }
          - { compiler: gcc-4.8,   cxxstd: "11",                os: ubuntu-latest, container: "ubuntu:16.04" }
          - { compiler: gcc-4.9,   cxxstd: "11",                os: ubuntu-latest, container: "ubuntu:16.04" }
          - { compiler: gcc-5,     cxxstd: "11,14,1z",          os: ubuntu-latest, container: "ubuntu:18.04" }
          - { compiler: gcc-6,     cxxstd: "11,14,17",          os: ubuntu-latest, container: "ubuntu:18.04" }
          - { compiler: gcc-7,     cxxstd: "11,14,17",          os: ubuntu-latest, container: "ubuntu:20.04" }
          - { compiler: gcc-8,     cxxstd: "11,14,17,2a",       os: ubuntu-latest, container: "ubuntu:20.04" }
          - { compiler: gcc-9,     cxxstd: "11,14,17,2a",       os: ubuntu-22.04 }
          - { compiler: gcc-10,    cxxstd: "11,14,17,20",       os: ubuntu-22.04 }
          - { compiler: gcc-11,    cxxstd: "11,14,17,20",       os: ubuntu-22.04 }
          - { compiler: gcc-12,    cxxstd: "11,14,17,20",       os: ubuntu-22.04 }
          - { compiler: gcc-13,    cxxstd: "11,14,17,20,2b",    os: ubuntu-24.04 }
          - { name: "Coverage w/ GCC on Linux", coverage: "yes",
              compiler: gcc-13,    cxxstd: "2b",                os: ubuntu-24.04, install: "g++-13-multilib gcc-multilib", address-model: "32,64" }
          - { name: "GCC w/ sanitizers", sanitize: "yes",
              compiler: gcc-13,    cxxstd: "11,14,17,20",       os: ubuntu-24.04 }
          - { compiler: gcc-14,    cxxstd: "11,14,17,20,23",    os: ubuntu-24.04 }
          - { compiler: gcc-15,    cxxstd: "11,14,17,20,23,2c", os: ubuntu-latest, container: "ubuntu:26.04" }
          - { compiler: gcc-16,    cxxstd: "11,14,17,20,23,26", os: ubuntu-latest, container: "ubuntu:26.04" }
          - { compiler: clang-11,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:20.04" }
          - { compiler: clang-12,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:20.04" }
          - { compiler: clang-13,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:22.04" }
          - { compiler: clang-14,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:22.04" }
          - { compiler: clang-15,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:22.04" }
          - { compiler: clang-16,  cxxstd: "11,14,17,20,2b",    os: ubuntu-latest, container: "ubuntu:24.04" }
          - { compiler: clang-17,  cxxstd: "11,14,17,20,23",    os: ubuntu-latest, container: "ubuntu:24.04" }
          - { compiler: clang-18,  cxxstd: "11,14,17,20,23,2c", os: ubuntu-24.04 }
          - { compiler: clang-19,  cxxstd: "11,14,17,20,23,2c", os: ubuntu-24.04 }
          - { compiler: clang-20,  cxxstd: "11,14,17,20,23,2c", os: ubuntu-latest, container: "ubuntu:25.04" }
          - { compiler: clang-21,  cxxstd: "11,14,17,20,23,2c", os: ubuntu-latest, container: "ubuntu:26.04" }
          - { compiler: clang-22,  cxxstd: "11,14,17,20,23,2c", os: ubuntu-latest, container: "ubuntu:26.04" }
          - { compiler: icpx-2025, cxxstd: "11,14,17,20,23,2c", os: ubuntu-latest, container: "intel/oneapi-hpckit:2025.2.2-0-devel-ubuntu24.04" }
          # libc++
          - { name: "Clang w/ sanitizers", sanitize: "yes", stdlib: "libc++",
              compiler: clang-12,  cxxstd: "11,14,17,20",       os: ubuntu-latest, container: "ubuntu:20.04" }
          # MacOS
          - { name: "MacOS sanitize w/ clang", sanitize: "yes",
              compiler: clang,     cxxstd: "11,14,17,20,2b",    os: macos-14 }
          - { compiler: clang-16,  cxxstd: "11,14,17,20,2b",    os: macos-15, xcode_app: "Xcode_16.2" }
          - { compiler: clang-18,  cxxstd: "11,14,17,20,2b",    os: macos-15 }
          - { compiler: clang-20,  cxxstd: "11,14,17,20,23,2c", os: macos-26 }
          # Arm64
          - { name: "ARM64 w/ GCC",
              compiler: gcc-13,    cxxstd: "11,14,17,20,2b",    os: ubuntu-24.04-arm }
          # Big-Endian
          - { name: "Big Endian w/ Clang on s390x", multiarch: "yes",
              compiler: clang,     cxxstd: "17",                os: ubuntu-latest, distro: fedora, edition: "34", arch: s390x }

    container:
      image: ${{ matrix.container }}
      volumes:
        - /node20_217:/node20_217:rw,rshared
        - /node24_217:/node24_217:rw,rshared
        - ${{ startsWith(matrix.container, 'ubuntu:1') && '/node20_217:/__e/node20:ro,rshared' || ' ' }}
        - ${{ startsWith(matrix.container, 'ubuntu:1') && '/node24_217:/__e/node24:ro,rshared' || ' ' }}

    steps:
      - name: Setup environment
        run: |
            if [ -f "/etc/debian_version" ]; then
                echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
                export DEBIAN_FRONTEND=noninteractive
            fi
            if [ -n "${{ matrix.container }}" ] && [ -f "/etc/debian_version" ]; then
                echo "::group::Install core tools"
                apt-get -o Acquire::Retries=$NET_RETRY_COUNT update
                apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install sudo software-properties-common curl
                echo "::endgroup::"
                echo "::group::Check & setup git version"
                if ! git_version=$(git --version 2>/dev/null); then
                    git_version=0.0.0
                fi
                # Extract version number from e.g. "git version 2.7.4"
                version=${git_version##* }
                echo "Git version: $version"
                required_git_version="2.18" # actions/checkout requires git 2.18
                if [[ "$(printf '%s\n' "$required_git_version" "$version" | sort -V | head -n1)" != "$required_git_version" ]]; then
                    # Need (newer) git, and the older Ubuntu container may require requesting the key manually using port 80
                    key_server="keyserver.boost.org"
                    echo "Downloading key from $key_server"
                    curl -sSL --retry ${NET_RETRY_COUNT:-5} "https://$key_server/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217" | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/git-core_ubuntu_ppa.gpg
                    VERSION_CODENAME=$(grep -ioP '^VERSION_CODENAME=\K.+' /etc/os-release || true)
                    echo "VERSION_CODENAME is ${VERSION_CODENAME}"
                    echo "deb http://ppa.launchpadcontent.net/git-core/ppa/ubuntu ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/git-core-ppa.list > /dev/null
                fi
                echo "::endgroup::"
                echo "::group::Update APT cache"
                apt-get -o Acquire::Retries=$NET_RETRY_COUNT update
                echo "::endgroup::"
                pkgs="g++ git xz-utils"
                osver=$(lsb_release -sr | cut -f1 -d.)
                echo "OS version: $osver"
                # Ubuntu 22+ has only Python 3 in the repos
                if [ -n "$osver" ] && [ "$osver" -ge "20" ]; then
                  pkgs+=" python-is-python3 libpython3-dev"
                else
                  pkgs+=" python libpython-dev"
                fi
                echo "::group::Install $pkgs"
                apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install $pkgs
                echo "::endgroup::"
            fi
            git config --global pack.threads 0
            if [[ "${{ matrix.container }}" == "ubuntu:1"* ]]; then
              echo "::group::Update node"
              # Install a node version that works with the glibc 2.17 of Ubuntu 16/18: https://github.com/actions/checkout/issues/1590
              curl -sL https://archives.boost.io/misc/node/node-v20.9.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node20_217
              # Node 24 triggers a bug in GLIBC 2.17 inside libnss_files.so.2 leading to a SIGSEGV, use Node 20 for both
              mkdir -p /node24_217
              cp -r /node20_217/* /node24_217/
              echo "::endgroup::"
            fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # For coverage builds fetch the whole history, else only 1 commit
          fetch-depth: ${{ matrix.coverage && '0' || '1' }}

      - name: Install packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
            sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT update
            if [[ -z "${{ matrix.install }}" ]]; then
                if [[ ! "${{ matrix.compiler }}" =~ icpx ]]; then
                    compiler="${{ matrix.compiler }}"
                    pkgs="${compiler/gcc-/g++-}"
                    if [[ "${{ matrix.stdlib }}" == "libc++" && $compiler == "clang-"* ]]; then
                        ver=${compiler#*-}
                        pkgs+=" libc++-${ver}-dev libc++abi-${ver}-dev"
                    fi
                fi
            else
                pkgs="${{ matrix.install }}"
            fi
            if [ -n "${pkgs}" ]; then
                sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install $pkgs
            fi

      - name: Setup multiarch
        if: matrix.multiarch
        run: |
            sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install binfmt-support qemu-user-static
            git clone --depth=1 https://github.com/jeking3/bdde.git ../bdde
            sudo ../bdde/bin/linux/bdde-multiarch
            sudo ../bdde/bin/linux/bdde-multiarch --version
            echo "$(cd ../bdde/bin/linux && pwd)" >> "$GITHUB_PATH"
            echo "B2_WRAPPER=bdde" >> "$GITHUB_ENV"
        env:
          BDDE_DISTRO: ${{ matrix.distro }}
          BDDE_EDITION: ${{ matrix.edition }}
          BDDE_ARCH: ${{ matrix.arch }}

      - name: Setup Boost
        run: |
            set -x
            # Required because inside a container the owner is root so git commands would fail.
            git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
            if [ -n "${{ matrix.xcode_app }}" ]; then
                sudo xcode-select -switch "/Applications/${{ matrix.xcode_app }}.app"
            fi

            REF=${GITHUB_BASE_REF:-$GITHUB_REF}
            REF=${REF##*/}
            BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
            cd ..
            git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
            cd boost-root
            git submodule update -q --init tools/boostdep
            rm -rf "libs/$SELF" && mkdir -p "libs/$SELF"
            cp -r "$GITHUB_WORKSPACE"/* "libs/$SELF/"
            $(command -v python || command -v python3) tools/boostdep/depinst/depinst.py --include benchmark --include example --include examples --include tools --git_args "--jobs $GIT_FETCH_JOBS" "$SELF"
            echo "BOOST_ROOT=$PWD" >> "$GITHUB_ENV"

            # Toolset and compiler for user-config.jam
            compiler="${{ matrix.compiler }}"
            if [[ "$compiler" =~ clang ]]; then
                B2_TOOLSET=clang
                CXX="${compiler/clang/clang++}"
                # On macOS use the system clang if it is the requested version, else the HomeBrew one
                if [[ "$RUNNER_OS" == "macOS" ]] && [[ "$compiler" == clang-* ]] && ! command -v "$CXX"; then
                    ver=${compiler#clang-}
                    if [[ "$(clang --version)" == *"clang version ${ver}."* ]]; then
                        CXX=clang++
                    else
                        CXX="$(brew --prefix "llvm@$ver")/bin/clang++"
                    fi
                fi
            elif [[ "$compiler" =~ icpx ]]; then
                B2_TOOLSET=intel-linux
                CXX=icpx
            else
                B2_TOOLSET=gcc
                CXX="${compiler/gcc/g++}"
            fi
            command -v "$CXX"
            "$CXX" --version
            echo "using $B2_TOOLSET : : $CXX ;" > ~/user-config.jam
            cat ~/user-config.jam
            echo "B2_TOOLSET=$B2_TOOLSET" >> "$GITHUB_ENV"
            # CXX in the environment would override B2's toolset
            echo "CXX=" >> "$GITHUB_ENV"

            ${B2_WRAPPER:-} ./bootstrap.sh
            ${B2_WRAPPER:-} ./b2 -d0 headers
        env:
          BDDE_DISTRO: ${{ matrix.distro }}
          BDDE_EDITION: ${{ matrix.edition }}
          BDDE_ARCH: ${{ matrix.arch }}

      - name: Run tests
        if: '!matrix.coverage'
        run: |
            set -x
            cd "$BOOST_ROOT"
            ARGS=(toolset=$B2_TOOLSET cxxstd=${{ matrix.cxxstd }} link=$B2_LINK variant=$B2_VARIANT -j$(( $(getconf _NPROCESSORS_ONLN) + 1 )))
            [ -z "${{ matrix.address-model }}" ] || ARGS+=(address-model=${{ matrix.address-model }})
            [ -z "${{ matrix.stdlib }}" ] || ARGS+=(stdlib=${{ matrix.stdlib }})
            [ "${{ matrix.sanitize }}" != "yes" ] || ARGS+=(address-sanitizer=norecover undefined-sanitizer=norecover)
            ${B2_WRAPPER:-} ./b2 libs/$SELF/test "${ARGS[@]}"
        env:
          UBSAN_OPTIONS: print_stacktrace=1,report_error_type=1
          BDDE_DISTRO: ${{ matrix.distro }}
          BDDE_EDITION: ${{ matrix.edition }}
          BDDE_ARCH: ${{ matrix.arch }}

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
            set -x
            cd "$BOOST_ROOT"
            ./b2 libs/$SELF/test toolset=$B2_TOOLSET cxxstd=${{ matrix.cxxstd }} link=$B2_LINK variant=debug \
                address-model=${{ matrix.address-model }} "cxxflags=-fkeep-static-functions --coverage" linkflags=--coverage \
                -j$(( $(getconf _NPROCESSORS_ONLN) + 1 ))

      - name: Show config.log
        if: always()
        run: cat "$BOOST_ROOT/bin.v2/config.log" || true

      - name: Collect coverage
        if: matrix.coverage
        run: |
            set -x
            GCOV=gcov-${{ matrix.compiler }}
            GCOV=${GCOV/gcc-/}
            sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install \
                libcapture-tiny-perl libdatetime-perl libjson-xs-perl || true
            LCOV_OPTIONS=(--rc branch_coverage=1 --ignore-errors inconsistent,mismatch,unused)
            rm -rf /tmp/lcov
            git clone --depth 1 -b v2.3 https://github.com/linux-test-project/lcov.git /tmp/lcov
            export PATH=/tmp/lcov/bin:$PATH
            lcov --version
            lcov "${LCOV_OPTIONS[@]}" --gcov-tool="$GCOV" --directory "$BOOST_ROOT" --capture --output-file all.info
            lcov "${LCOV_OPTIONS[@]}" --list all.info
            # Limit to this library: its headers and libs/$SELF
            for f in $(for h in include/boost/*; do echo "$h"; done | cut -f2- -d/); do echo "*/$f*"; done > /tmp/interesting
            cat /tmp/interesting
            xargs --verbose -L 999999 -a /tmp/interesting lcov "${LCOV_OPTIONS[@]}" --extract all.info "*/libs/$SELF/*" --output-file coverage.info
            lcov "${LCOV_OPTIONS[@]}" --list coverage.info

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          disable_search: true
          files: coverage.info
          name: Github Actions (POSIX)
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  coverity:
    name: Coverity Scan w/ Clang on Linux
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'master')
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      COVERITY_SCAN_NOTIFICATION_EMAIL: ${{ secrets.COVERITY_SCAN_NOTIFICATION_EMAIL }}
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: env.COVERITY_SCAN_TOKEN

      - name: Install packages
        if: env.COVERITY_SCAN_TOKEN
        run: |
            sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT update
            sudo apt-get -o Acquire::Retries=$NET_RETRY_COUNT -y -q --no-install-suggests --no-install-recommends install clang-12

      - name: Setup Boost
        if: env.COVERITY_SCAN_TOKEN
        run: |
            set -x
            REF=${GITHUB_BASE_REF:-$GITHUB_REF}
            REF=${REF##*/}
            BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
            cd ..
            git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
            cd boost-root
            git submodule update -q --init tools/boostdep
            rm -rf "libs/$SELF" && mkdir -p "libs/$SELF"
            cp -r "$GITHUB_WORKSPACE"/* "libs/$SELF/"
            $(command -v python || command -v python3) tools/boostdep/depinst/depinst.py --include benchmark --include example --include examples --include tools --git_args "--jobs $GIT_FETCH_JOBS" "$SELF"
            echo "BOOST_ROOT=$PWD" >> "$GITHUB_ENV"
            echo "using clang : : clang++-12 ;" > ~/user-config.jam
            ./bootstrap.sh
            ./b2 -d0 headers

      - name: Run coverity
        if: env.COVERITY_SCAN_TOKEN
        run: |
            set -x
            pushd /tmp
            rm -rf coverity_tool.tgz cov-analysis*
            curl -L -d "token=${COVERITY_SCAN_TOKEN}&project=${GITHUB_REPOSITORY}" -X POST https://scan.coverity.com/download/cxx/linux64 -o coverity_tool.tgz
            tar xzf coverity_tool.tgz
            export PATH=$(echo "$(pwd)"/cov-analysis*/bin):$PATH
            popd
            RESULTS_DIR="$(pwd)/cov-int"
            mkdir "${RESULTS_DIR}"
            cov-configure --template --compiler clang++-12 --comptype clangcxx
            (cd "$BOOST_ROOT" && cov-build --dir "${RESULTS_DIR}" ./b2 libs/$SELF/test toolset=clang cxxstd=20 link=$B2_LINK variant=$B2_VARIANT -j3)
            tail -50 "${RESULTS_DIR}/build-log.txt"
            tar czf cov-int.tgz cov-int
            curl --form token="${COVERITY_SCAN_TOKEN}" \
                 --form email="${COVERITY_SCAN_NOTIFICATION_EMAIL}" \
                 --form file=@cov-int.tgz \
                 --form version="${GITHUB_REF_NAME}" \
                 --form description="${GITHUB_REPOSITORY}:${GITHUB_REF}:${GITHUB_SHA}:${GITHUB_RUN_NUMBER}" \
                 https://scan.coverity.com/builds?project="${GITHUB_REPOSITORY}"
