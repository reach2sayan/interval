#
# Self-contained CI.  It runs the same jobs on the same platforms as the
# Boost.CI reusable workflow this repository used before, with the settings
# it passed to it:
#   - MinGW disabled (https://github.com/boostorg/interval/issues/41)
#   - clang before 11 excluded: clang < 10 does not support the necessary
#     floating point options (-frounding-math) and clang 10 has a C++20
#     ambiguous operator resolution bug
#     (https://github.com/llvm/llvm-project/issues/43110)
---
name: CMake

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - pr/**
    paths-ignore:
      - LICENSE
      - meta/**
      - README.md

concurrency:
  group: ${{ github.ref }}:${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SELF: numeric/interval
  GIT_FETCH_JOBS: 8
  NET_RETRY_COUNT: 5
  B2_LINK: shared,static
  B2_VARIANT: debug,release

jobs:
  cmake:
    name: cmake (${{ matrix.name && format('{0}, ', matrix.name) || '' }}${{ matrix.os }}, ${{ matrix.build_shared }}, ${{ matrix.build_type }}, ${{ matrix.generator }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,       build_shared: "ON",  build_type: Debug, generator: "Unix Makefiles" }
          - { os: ubuntu-latest,       build_shared: "OFF", build_type: Debug, generator: "Unix Makefiles" }
          - { os: windows-2022,        build_shared: "ON",  build_type: Debug, generator: "Visual Studio 17 2022" }
          - { os: windows-2022,        build_shared: "OFF", build_type: Debug, generator: "Visual Studio 17 2022" }
          - { os: windows-2025-vs2026, build_shared: "OFF", build_type: Debug, generator: "Visual Studio 18 2026" }
          - { name: "Min. CMake", cmake_version: "3.16",
              os: ubuntu-latest,       build_shared: "ON",  build_type: Debug, generator: "Unix Makefiles" }

    steps:
      - name: Cache CMake
        if: matrix.cmake_version
        id: cache-cmake
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/cmake
          key: ${{ runner.os }}-cmake-${{ matrix.cmake_version }}

      - name: Install CMake dependencies
        if: matrix.cmake_version
        run: |
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 -y -q --no-install-suggests --no-install-recommends install curl libcurl4-openssl-dev libarchive-dev
            echo /tmp/cmake/bin >> "$GITHUB_PATH"

      - name: Build CMake
        if: matrix.cmake_version && steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
            version=${{ matrix.cmake_version }}
            [[ ${version} =~ [0-9]+\.[0-9]+\.[0-9]+ ]] || version+=".0"
            filename="cmake-$version.tar.gz"
            cd "$(mktemp -d)"
            wget https://cmake.org/files/v${version%.*}/$filename
            tar -xf $filename --strip-components=1
            flags=(
              "-DCMAKE_BUILD_TYPE=Release"
              "-DCMAKE_INSTALL_PREFIX=/tmp/cmake"
              "-B" "__build"
              "-Wno-dev"  # Make configuring more silent
              "-DCMAKE_USE_SYSTEM_CURL=1"  # Avoid failures caused by newer (system) OpenSSL in CMake < 3.10
              "-DCMAKE_CXX_FLAGS='-include cstdint -include limits'"  # Fix missing includes in CMake < 3.10
            )
            cmake "${flags[@]}" .
            cmake --build __build -- -j 3
            cmake --build __build --target install

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Boost
        run: |
            set -x
            SRC=$(pwd)
            REF=${GITHUB_BASE_REF:-$GITHUB_REF}
            REF=${REF##*/}
            BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
            cd ..
            git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
            cd boost-root
            git submodule update -q --init tools/boostdep
            rm -rf "libs/$SELF" && mkdir -p "libs/$SELF"
            # Through tar so symlinks are restored as-is on Windows
            tar -C "$SRC" -cf - . | tar -C "libs/$SELF" -xf -
            $(command -v python || command -v python3) tools/boostdep/depinst/depinst.py --include benchmark --include example --include examples --include tools --git_args "--jobs $GIT_FETCH_JOBS" "$SELF"
            echo "BOOST_ROOT=$PWD" >> "$GITHUB_ENV"

      - name: Run CMake tests
        run: |
            cd "$BOOST_ROOT"
            mkdir __build_cmake_test__ && cd __build_cmake_test__
            cmake -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBOOST_INCLUDE_LIBRARIES=$SELF -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} -DBUILD_TESTING=ON -DBoost_VERBOSE=ON ..
            cmake --build . --target tests --config ${{ matrix.build_type }} -j3
            ctest --output-on-failure --no-tests=error --build-config ${{ matrix.build_type }}

      - name: Run CMake subdir tests
        run: |
            cd "$BOOST_ROOT/libs/$SELF/test/cmake_subdir_test"
            mkdir __build_cmake_subdir_test__ && cd __build_cmake_subdir_test__
            cmake -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} ..
            cmake --build . --config ${{ matrix.build_type }} -j3
            ctest --output-on-failure --no-tests=error --build-config ${{ matrix.build_type }}

      - name: Install Library
        run: |
            BCM_INSTALL_PATH=/tmp/boost_install
            echo "BCM_INSTALL_PATH=$BCM_INSTALL_PATH" >> "$GITHUB_ENV"
            cd "$BOOST_ROOT"
            mkdir __build_cmake_install_test__ && cd __build_cmake_install_test__
            cmake -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBOOST_INCLUDE_LIBRARIES=$SELF -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} -DCMAKE_INSTALL_PREFIX="$BCM_INSTALL_PATH" -DBoost_VERBOSE=ON -DBoost_DEBUG=ON ..
            cmake --build . --target install --config ${{ matrix.build_type }} -j3

      - name: Run CMake install tests
        run: |
            cd "$BOOST_ROOT/libs/$SELF/test/cmake_install_test"
            mkdir __build_cmake_install_test__ && cd __build_cmake_install_test__
            unset BOOST_ROOT # Make sure CMake finds the installed config, not the source tree
            cmake -G "${{ matrix.generator }}" -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$BCM_INSTALL_PATH" -DCMAKE_VERBOSE_MAKEFILE=ON ..
            cmake --build . --config ${{ matrix.build_type }} -j3
            if [ "$RUNNER_OS" == "Windows" ]; then
                export PATH="$BCM_INSTALL_PATH/bin:$PATH"
            else
                export LD_LIBRARY_PATH="$BCM_INSTALL_PATH/lib:${LD_LIBRARY_PATH:-}"
            fi
            ctest --output-on-failure --no-tests=error --build-config ${{ matrix.build_type }}
